<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#00a884" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#bgGrad)" stroke="url(#emeraldGlow)" stroke-width="6" stroke-opacity="0.4" filter="url(#shadow)" />
  
  <!-- Subtle Inner Light Background Glow -->
  <circle cx="256" cy="230" r="180" fill="url(#centerGlow)" />

  <!-- Shield / Wallet Geometric Body -->
  <g filter="url(#shadow)">
    <!-- Wallet Back Flap -->
    <path d="M 120 180 C 120 150, 150 130, 190 130 L 322 130 C 362 130, 392 150, 392 180 L 392 320 C 392 360, 362 385, 320 385 L 192 385 C 150 385, 120 360, 120 320 Z" 
          fill="#0f2922" stroke="url(#cyanAccent)" stroke-width="4" stroke-opacity="0.4"/>
    
    <!-- Growth Trend Wave Accent Underlay -->
    <path d="M 130 330 Q 210 240 280 270 T 385 180 L 385 320 C 385 355 355 380 320 380 L 190 380 C 155 380 130 355 130 330 Z" 
          fill="url(#emeraldGlow)" fill-opacity="0.25"/>

    <!-- Wallet Front Card / Fold -->
    <path d="M 112 210 C 112 180, 142 165, 180 165 L 332 165 C 370 165, 400 180, 400 210 L 400 330 C 400 370, 368 395, 328 395 L 184 395 C 144 395, 112 370, 112 330 Z" 
          fill="url(#bgGrad)" stroke="url(#emeraldGlow)" stroke-width="5"/>

    <!-- Trend Arrow Line Up -->
    <path d="M 145 325 L 220 250 L 275 295 L 365 190" 
          fill="none" stroke="url(#emeraldGlow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="365,190 330,195 360,225" fill="#34d399" />

    <!-- Modern Central Gold Currency Coin Badge -->
    <circle cx="256" cy="275" r="58" fill="url(#goldGlow)" stroke="#fff" stroke-width="4" stroke-opacity="0.7" filter="url(#shadow)" />
    <circle cx="256" cy="275" r="48" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />

    <!-- Khmer Riel '៛' & Finance Symbol in Coin -->
    <text x="256" y="295" font-family="'Kantumruy Pro', 'Khmer OS Battambang', 'Inter', sans-serif" font-size="52" font-weight="900" fill="#78350f" text-anchor="middle">៛</text>
  </g>

  <!-- Sparkles / Star Accents -->
  <g fill="#fef08a" opacity="0.85">
    <path d="M 380 115 Q 380 135 390 135 Q 380 135 380 155 Q 380 135 370 135 Q 380 135 380 115 Z" />
    <path d="M 130 135 Q 130 148 138 148 Q 130 148 130 160 Q 130 148 122 148 Q 130 148 130 135 Z" />
  </g>
</svg>
